[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsheild"
version = "0.1.0"
description = "Finsheild — ML-first fraud intelligence platform (multi-signal fusion engine)"
authors = [{ name = "Riddhi Bantia" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
    "kagglehub>=0.1",
    "opendatasets>=0.1.22",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "tqdm>=4.60",
    "pyarrow>=15.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/finsheild"]
